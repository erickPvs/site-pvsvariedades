<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guias | PVS Variedades</title>
<!-- Tailwind CSS (CDN) para as classes de Glassmorphism -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Arial', 'Helvetica', 'sans-serif'],
      },
    },
  },
};
</script>
<style>
html,body{
margin:0;
padding:0;
font-family:Arial, Helvetica, sans-serif;
background:#f2f2f2;
overflow:hidden;
}
/* HERO */
.hero{
position:absolute;
top:110px;
width:100%;
text-align:center;
color:white;
z-index:15;
}
.hero h1{
font-size:34px;
margin-bottom:10px;
}
.hero p{
font-size:16px;
opacity:.85;
}
/* CONTAINER */
.container{
display:flex;
min-height:100vh;
width:100%;
}
/* PAINEL */
.panel{
flex:1;
position:relative;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
cursor:pointer;
transition:.45s;
border:1px solid rgba(255,255,255,.08);
}
/* IMAGEM */
.panel::before{
content:"";
position:absolute;
width:110%;
height:110%;
background-size:cover;
background-position:center;
background-repeat:no-repeat;
filter:grayscale(100%) brightness(1.25) opacity(.45);
transition:.4s;
}
/* GRADIENTE (overlay de legibilidade - mais leve, a cápsula de vidro assume o contraste) */
.panel::after{
content:"";
position:absolute;
width:100%;
height:100%;
background:linear-gradient(
to bottom,
rgba(0,0,0,0) 20%,
rgba(0,0,0,.35) 60%,
rgba(0,0,0,.6) 100%
);
opacity:1;
transition:.45s;
}
/* HOVER */
.panel:hover::before{
filter:grayscale(0%) brightness(1) opacity(1);
transform:scale(1.05);
}
.panel:hover::after{
opacity:.5;
}
.panel:hover{
flex:1.4;
z-index:5;
box-shadow:
0 40px 80px rgba(0,0,0,.35),
0 10px 30px rgba(0,0,0,.25);
}
/* ACTIVE */
.container:hover .panel{
filter:blur(2px) brightness(.85);
}
.container:hover .panel:hover{
filter:none;
}
/* IMAGENS */
.acf::before{
background-image:url("../images/guia.webp");
}
.pelicula-lcd::before{
background-image:url("../images/pelicula-lcd.webp");
}
/* TEXTO */
.overlay{
position:absolute;
bottom:30px;
width:70%;
text-align:center;
color:white;
z-index:3;
}
.subtitle{
font-size:16px;
margin-bottom:10px;
text-shadow:0 1px 6px rgba(0,0,0,.6);
}
.badge{
font-size:12px;
background:rgba(255,255,255,.15);
padding:6px 10px;
border-radius:8px;
display:inline-block;
}
/* LINK */
.panel a{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
z-index:5;
}
/* MOBILE */
@media (max-width:900px){
.container{
flex-direction:column;
}
.panel{
height:50vh;
}
.container:hover .panel{
filter:none;
}
.hero{
top:100px;
}
}
</style>
</head>
<body>

<!-- HEADER / NAVBAR (minimalista com logo) -->
<header class="absolute top-0 left-0 right-0 z-40 flex items-center justify-between px-6 py-4">
  <a href="/" aria-label="PVS Variedades - Página inicial">
    <img src="../images/logo_pvsvariedades.webp" alt="PVS Variedades" class="h-12 w-auto" />
  </a>
  <a href="/" class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-black/30 px-4 py-2 text-sm text-white shadow-lg backdrop-blur-md transition hover:bg-black/50">
    ← Página inicial
  </a>
</header>

<!-- HERO -->
<div class="hero">
<h1>Guias técnicos</h1>
<p>Aprenda a resolver problemas e obter resultados profissionais</p>
</div>

<div class="container">
<!-- ACF -->
<div class="panel acf">
<a href="/guias/guia-acf.html"></a>
<div class="overlay">
<h3 class="mb-3 inline-block rounded-2xl border border-white/10 bg-black/40 px-5 py-2.5 text-2xl font-bold text-white shadow-lg backdrop-blur-md md:text-3xl">Troca do Filme ACF</h3>
<div class="subtitle">Evite falhas e mantenha qualidade constante</div>
</div>
</div>
<!-- PELICULA DE LCD -->
<div class="panel pelicula-lcd">
<a href="/guias/guia-pelicula-lcd.html"></a>
<div class="overlay">
<h3 class="mb-3 inline-block rounded-2xl border border-white/10 bg-black/40 px-5 py-2.5 text-2xl font-bold text-white shadow-lg backdrop-blur-md md:text-3xl">Película de Proteção de LCD</h3>
<div class="subtitle">Passo a passo completo para instalação da película protetora.</div>
</div>
</div>
</div>

</body>
</html>
